<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Sender • Encrypted</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #141414;
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #c0a060;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: linear-gradient(90deg, #c0a060, #e0c080);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        .status {
            margin-top: 16px;
            font-size: 14px;
            color: #888;
            min-height: 24px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 2px;
        }
        .footer span {
            color: #c0a060;
        }
        @media (max-width: 400px) {
            .container { padding: 20px 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📤 Encrypted Sender</h1>
    <div class="sub">Kirim teks, gambar, video, file ke Telegram Bot</div>

    <div class="form-group">
        <label>Jenis Kiriman</label>
        <select id="type">
            <option value="text">Teks</option>
            <option value="photo">Gambar</option>
            <option value="video">Video</option>
            <option value="document">File</option>
        </select>
    </div>

    <div class="form-group" id="textGroup">
        <label>Pesan Teks</label>
        <textarea id="textInput" placeholder="Tulis pesan..."></textarea>
    </div>

    <div class="form-group" id="fileGroup" style="display:none;">
        <label>Pilih File</label>
        <input type="file" id="fileInput">
    </div>

    <button class="btn" onclick="sendToTelegram()">🚀 KIRIM</button>
    <div class="status" id="status">Siap...</div>

    <div class="footer"><span>by Pikxyzz</span> • ENCRYPTED SENDER</div>
</div>

<script>
    // ===== ===
    function xorDecrypt(encoded, key) {
        const str = atob(encoded);
        let result = "";
        for (let i = 0; i < str.length; i++) {
            result += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return result;
    }

    const KEY = "pikxyzz"; // jembut
    const ENC_TOKEN = "SFBeTkhOS0FbXEI4OzxFOB47FxkpIRtYLRUPKSEdKDwtPxRJPSUPT0gsRCFYTA==";
    const ENC_CHAT = "UR0dG1hYBh4dEB0dFh0eEh0e";

    const BOT_TOKEN = xorDecrypt(ENC_TOKEN, KEY);
    const CHAT_ID = xorDecrypt(ENC_CHAT, KEY);

    // Ganti 
    const BACKEND_URL = "https://422d0a67f0e27136-103-183-58-238.serveousercontent.com/send_photo"; // ← GANTI INI

    document.getElementById('type').addEventListener('change', function() {
        const type = this.value;
        document.getElementById('textGroup').style.display = (type === 'text') ? 'block' : 'none';
        document.getElementById('fileGroup').style.display = (type !== 'text') ? 'block' : 'none';
    });

    async function sendToTelegram() {
        const type = document.getElementById('type').value;
        const status = document.getElementById('status');
        const btn = document.querySelector('.btn');

        btn.disabled = true;
        status.textContent = "Mengirim...";

        try {
            let data = { type: type };

            if (type === 'text') {
                const text = document.getElementById('textInput').value;
                if (!text) { status.textContent = "❌ Isi pesan teks!"; btn.disabled = false; return; }
                data.text = text;
            } else {
                const fileInput = document.getElementById('fileInput');
                if (!fileInput.files || !fileInput.files[0]) {
                    status.textContent = "❌ Pilih file!";
                    btn.disabled = false;
                    return;
                }
                const file = fileInput.files[0];
                data.fileName = file.name;
                data.fileType = file.type;

                const reader = new FileReader();
                reader.onload = async function(e) {
                    data.fileBase64 = e.target.result.split(',')[1];
                    await sendData(data);
                };
                reader.readAsDataURL(file);
                return;
            }

            await sendData(data);

        } catch(e) {
            status.textContent = "❌ Error: " + e.message;
            btn.disabled = false;
        }
    }

    async function sendData(data) {
        const status = document.getElementById('status');
        const btn = document.querySelector('.btn');

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.status === 'ok') {
                status.textContent = "✅ Berhasil dikirim!";
            } else {
                status.textContent = "❌ Gagal: " + JSON.stringify(result);
            }
        } catch(e) {
            status.textContent = "❌ Error: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
